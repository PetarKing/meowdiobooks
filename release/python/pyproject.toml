[project]
name = "meowdiobooks-workflow"
version = "0.1.28"
description = "Composable Meowdiobooks workflow, artifact, and local reference implementations."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.139.0",
  "lxml==6.0.0",
  "numpy==2.5.1",
  "pdfplumber==0.11.7",
  "pydantic==2.11.7",
  "pypdf==5.8.0",
  "python-multipart==0.0.32",
  "reportlab==4.4.3",
  "scipy==1.18.0",
  "uvicorn==0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = []

[tool.hatch.build.force-include]
"../../src/meowdiobooks" = "meowdiobooks"
"../../models.toml" = "meowdiobooks/resources/models.toml"
