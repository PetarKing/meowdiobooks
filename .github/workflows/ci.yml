name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-install-project

      - name: Lint
        run: uv run --no-sync ruff check src/meowdiobooks tests

      - name: Check publication hygiene
        run: python scripts/check_publication.py

      - name: Test
        run: >-
          uv run --no-sync pytest -q
          -m "not uses_audio_decoder and not runs_models"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check Storybook types
        run: npm run storybook:check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Storybook browser and accessibility tests
        run: npm run test-storybook

      - name: Build Storybook
        run: npm run build-storybook

      - name: Packaged host compatibility
        run: npm run test:consumer

      - name: Review canonical screens on desktop and phone in both appearances
        run: npm run visual:review -- /tmp/meowdiobooks-visual-review

      - name: Upload visual review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-visual-review
          path: |
            /tmp/meowdiobooks-visual-review/report.json
            /tmp/meowdiobooks-visual-review/*.png
          retention-days: 7
